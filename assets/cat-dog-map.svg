    <path d="M892 190h70"/>
    <path d="M470 594h82"/>
  </g>

  <path d="M126 368C260 360 363 375 472 391" fill="none" stroke="#c9ff5c" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#arrow)"/>
  <path d="M1090 346C974 350 867 366 748 390" fill="none" stroke="#c9ff5c" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#arrow)"/>
  <path d="M610 676C602 611 593 557 603 496" fill="none" stroke="#c9ff5c" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#arrow)"/>

  <g font-family="Microsoft YaHei, sans-serif">
