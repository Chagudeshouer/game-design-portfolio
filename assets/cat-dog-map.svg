    <text x="924" y="92" fill="#9a9b96" font-size="11" font-weight="700" letter-spacing="2">SPAWN / B</text>
    <text x="193" y="705" fill="#9a9b96" font-size="11" font-weight="700" letter-spacing="2">LOW ROUTE</text>
